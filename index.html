<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mini Mario Classic World</title>
    <style>
        * { box-sizing: border-box; touch-action: manipulation; user-select: none; }
        body { margin: 0; padding: 10px; background: #5c94fc; text-align: center; font-family: Arial, sans-serif; color: #fff; }
        h2 { margin: 5px 0 10px 0; text-shadow: 2px 2px 0 #000; }
        canvas { background: #5c94fc; display: block; margin: 0 auto; border-bottom: 15px solid #c84c0c; box-shadow: 0 4px 10px rgba(0,0,0,0.3); max-width: 100%; }
        
        #menu { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(92, 148, 252, 0.98); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; }
        #menu h1 { text-shadow: 3px 3px 0 #000; margin-bottom: 15px; }
        .menu-btn { width: 220px; padding: 12px; margin: 8px; font-size: 16px; font-weight: bold; border: 3px solid #000; border-radius: 10px; cursor: pointer; box-shadow: 0 4px 0 #000; }
        .btn-easy { background: #00d800; color: #000; }
        .btn-normal { background: #f8d800; color: #000; }
        .btn-hard { background: #e75910; color: #fff; }
        .menu-btn:disabled { background: #808080; color: #333; cursor: not-allowed; box-shadow: none; transform: none; }
        .menu-btn:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 0 0 #000; }

        .controls { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 360px; margin: 15px auto 0 auto; }
        .d-pad { display: flex; gap: 10px; }
        .btn { width: 65px; height: 55px; background: #f8d800; color: #000; border: 3px solid #000; font-weight: bold; font-size: 20px; border-radius: 10px; box-shadow: 0 4px 0 #000; cursor: pointer; }
        .btn:active { transform: translateY(4px); box-shadow: 0 0 0 #000; background: #d4b800; }
        .btn-jump { width: 80px; background: #e75910; color: #fff; }
        .btn-jump:active { background: #b54007; }
    </style>
</head>
<body>
    <div id="menu">
        <h1>SUPER MARIO</h1>
        <p>CHỌN ĐỘ KHÓ:</p>
        <button class="menu-btn btn-easy" onclick="initGame('easy')">EASY (Dễ)</button>
        <button id="btnNormal" class="menu-btn btn-normal" onclick="initGame('normal')" disabled>MEDIUM (Khóa 🔒)</button>
        <button id="btnHard" class="menu-btn btn-hard" onclick="initGame('hard')" disabled>HARD (Khóa 🔒)</button>
    </div>

    <h2>MINI MARIO 1-1</h2>
    <canvas id="game" width="360" height="200"></canvas>
    <div class="controls">
        <div class="d-pad">
            <button class="btn" id="leftBtn">◄</button>
            <button class="btn" id="rightBtn">►</button>
        </div>
        <button class="btn btn-jump" id="jumpBtn">NHẢY</button>
    </div>

    <script>
        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");

        let gameStarted = false;
        let difficulty = "easy";
        let unlockedMedium = false;
        let unlockedHard = false;

        let mario = {
            x: 40, y: 130, w: 18, h: 26, dy: 0, speed: 2.5,
            gravity: 0.45, jumpPower: -8.5, isGrounded: false
        };

        let coins = 0;
        let cameraX = 0;
        let keys = { left: false, right: false };
        let worldWidth = 800;

        let blocks = [];
        let pipes = [];
        let piranhas = [];
        let enemies = [];
        let stairs = [];
        let flagX = 750;

        let coinEffect = { x: 0, y: 0, dy: 0, active: false };

        window.initGame = function(mode) {
            difficulty = mode;
            gameStarted = true;
            document.getElementById("menu").style.display = "none";

            // Cấu hình chiều dài và độ khó tương ứng
            if (mode === "easy") {
                worldWidth = 900; // Ngắn
                mario.speed = 2.8;
            } else if (mode === "normal") {
                worldWidth = 1500; // Dài hơn một chút
                mario.speed = 2.5;
            } else if (mode === "hard") {
                worldWidth = 3000; // Dài gấp đôi Medium (khó và thách thức hơn)
                mario.speed = 2.2;
                mario.gravity = 0.5;
            }

            flagX = worldWidth - 150;
            setupWorldObjects();
            mario.x = 40;
            mario.y = 130;
        };

        function setupWorldObjects() {
            blocks = [];
            pipes = [];
            piranhas = [];
            enemies = [];
            stairs = [];

            if (difficulty === "easy") {
                blocks = [
                    { x: 150, y: 100, w: 20, h: 20, type: "question", hit: false },
                    { x: 170, y: 100, w: 20, h: 20, type: "brick" },
                    { x: 190, y: 100, w: 20, h: 20, type: "question", hit: false }
                ];
                pipes = [{ x: 400, y: 120, w: 32, h: 40 }];
                piranhas = [{ x: 408, y: 120, w: 16, h: 20, visible: false, timer: 0 }];
                enemies = [{ x: 280, y: 144, w: 16, h: 16, dir: -1, alive: true }];
                stairs = [{ x: 650, base: 160, steps: 4 }];
            } else if (difficulty === "normal") {
                blocks = [
                    { x: 150, y: 100, w: 20, h: 20, type: "question", hit: false },
                    { x: 400, y: 90, w: 20, h: 20, type: "brick" },
                    { x: 750, y: 100, w: 20, h: 20, type: "question", hit: false },
                    { x: 1100, y: 90, w: 20, h: 20, type: "brick" }
                ];
                pipes = [
                    { x: 300, y: 120, w: 32, h: 40 },
                    { x: 850, y: 120, w: 32, h: 40 }
                ];
                piranhas = [
                    { x: 308, y: 120, w: 16, h: 20, visible: false, timer: 0 },
                    { x: 858, y: 120, w: 16, h: 20, visible: false, timer: 120 }
                ];
                enemies = [
                    { x: 220, y: 144, w: 16, h: 16, dir: -1, alive: true },
                    { x: 650, y: 144, w: 16, h: 16, dir: 1, alive: true },
                    { x: 1200, y: 144, w: 16, h: 16, dir: -1, alive: true }
                ];
                stairs = [{ x: 1300, base: 160, steps: 5 }];
            } else if (difficulty === "hard") {
                // Hard dài gấp đôi, nhiều chướng ngại vật, ống cống và cây ăn thịt dày đặc hơn
                blocks = [
                    { x: 200, y: 90, w: 20, h: 20, type: "question", hit: false },
                    { x: 500, y: 90, w: 20, h: 20, type: "brick" },
                    { x: 900, y: 90, w: 20, h: 20, type: "question", hit: false },
                    { x: 1400, y: 90, w: 20, h: 20, type: "brick" },
                    { x: 1900, y: 90, w: 20, h: 20, type: "question", hit: false },
                    { x: 2400, y: 90, w: 20, h: 20, type: "brick" }
                ];
                pipes = [
                    { x: 350, y: 120, w: 32, h: 40 },
                    { x: 750, y: 120, w: 32, h: 40 },
                    { x: 1200, y: 120, w: 32, h: 40 },
                    { x: 1700, y: 120, w: 32, h: 40 },
                    { x: 2200, y: 120, w: 32, h: 40 },
                    { x: 2600, y: 120, w: 32, h: 40 }
                ];
                piranhas = [
                    { x: 358, y: 120, w: 16, h: 20, visible: false, timer: 0 },
                    { x: 758, y: 120, w: 16, h: 20, visible: false, timer: 60 },
                    { x: 1208, y: 120, w: 16, h: 20, visible: false, timer: 30 },
                    { x: 1708, y: 120, w: 16, h: 20, visible: false, timer: 90 },
                    { x: 2208, y: 120, w: 16, h: 20, visible: false, timer: 40 },
                    { x: 2608, y: 120, w: 16, h: 20, visible: false, timer: 100 }
                ];
                enemies = [
                    { x: 280, y: 144, w: 16, h: 16, dir: -1, alive: true },
                    { x: 650, y: 144, w: 16, h: 16, dir: 1, alive: true },
                    { x: 1050, y: 144, w: 16, h: 16, dir: -1, alive: true },
                    { x: 1550, y: 144, w: 16, h: 16, dir: 1, alive: true },
                    { x: 2050, y: 144, w: 16, h: 16, dir: -1, alive: true },
                    { x: 2500, y: 144, w: 16, h: 16, dir: 1, alive: true }
                ];
                stairs = [{ x: 2750, base: 160, steps: 6 }];
            }
        }

        function drawGround() {
            const groundY = 160;
            ctx.fillStyle = "#c84c0c";
            ctx.fillRect(0, groundY, worldWidth, 40);

            ctx.strokeStyle = "#000";
            ctx.lineWidth = 1;
            for (let x = 0; x < worldWidth; x += 16) {
                for (let y = groundY; y < canvas.height; y += 10) {
                    ctx.strokeRect(x, y, 16, 10);
                    ctx.fillStyle = "#fc9838";
                    ctx.fillRect(x + 2, y + 2, 12, 2);
                }
            }

            // Vẽ bụi cỏ trang trí phong cách cổ điển
            ctx.fillStyle = "#00a800";
            [100, 500, 1050, 1650, 2150].forEach(gx => {
                if (gx < worldWidth) {
                    ctx.fillRect(gx, groundY - 12, 32, 12);
                    ctx.fillStyle = "#00d800";
                    ctx.fillRect(gx + 6, groundY - 16, 20, 4);
                    ctx.fillStyle = "#00a800";
                }
            });

            // Vẽ cột cờ / Lâu đài đích đến cuối màn
            ctx.fillStyle = "#fff";
            ctx.fillRect(flagX, 70, 4, 90);
            ctx.fillStyle = "#00d800";
            ctx.beginPath();
            ctx.arc(flagX + 2, 70, 5, 0, Math.PI * 2);
            ctx.fill();

            // Khối bệ cờ
            ctx.fillStyle = "#c84c0c";
            ctx.fillRect(flagX - 10, 140, 24, 20);
            ctx.strokeRect(flagX - 10, 140, 24, 20);

            // Lâu đài gạch phía sau cột cờ
            ctx.fillStyle = "#c84c0c";
            ctx.fillRect(flagX + 40, 100, 60, 60);
            ctx.strokeRect(flagX + 40, 100, 60, 60);
            ctx.fillStyle = "#000";
            ctx.fillRect(flagX + 60, 130, 20, 30); // Cửa lâu đài
        }

        // Vẽ bậc thang kiểu Mario
        function drawStairs() {
            stairs.forEach(s => {
                for (let i = 0; i < s.steps; i++) {
                    for (let j = 0; j <= i; j++) {
                        let bx = s.x + (i * 16);
                        let by = s.base - ((j + 1) * 12);
                        ctx.fillStyle = "#c84c0c";
                        ctx.fillRect(bx, by, 16, 12);
                        ctx.strokeStyle = "#000";
                        ctx.strokeRect(bx, by, 16, 12);
                    }
                }
            });
        }

        function drawMario() {
            ctx.fillStyle = "#e40058"; // Áo & Mũ đỏ
            ctx.fillRect(mario.x + 2, mario.y, 14, 6);
            ctx.fillRect(mario.x + 2, mario.y + 12, 14, 8);
            ctx.fillStyle = "#fc9838"; // Mặt
            ctx.fillRect(mario.x + 4, mario.y + 6, 10, 6);
            ctx.fillStyle = "#0000d8"; // Quần yếm xanh
            ctx.fillRect(mario.x + 4, mario.y + 18, 10, 8);
        }

        function drawGoomba(e) {
            if (!e.alive) return;
            ctx.fillStyle = "#a81000";
            ctx.fillRect(e.x + 2, e.y, 12, 10);
            ctx.fillStyle = "#fc9838";
            ctx.fillRect(e.x, e.y + 10, 16, 6);
            ctx.fillStyle = "#fff";
            ctx.fillRect(e.x + 3, e.y + 4, 3, 4);
            ctx.fillRect(e.x + 10, e.y + 4, 3, 4);
        }

        function drawPiranhas() {
            piranhas.forEach(p => {
                if (!p.visible) return;
                ctx.fillStyle = "#00d800";
                ctx.fillRect(p.x + 6, p.y + 10, 4, p.h - 10);
                ctx.fillStyle = "#e40058";
                ctx.fillRect(p.x, p.y, p.w, 12);
                ctx.fillStyle = "#fff";
                ctx.fillRect(p.x + 2, p.y + 5, 3, 3);
                ctx.fillRect(p.x + 11, p.y + 5, 3, 3);
            });
        }

        function drawBlocks() {
            blocks.forEach(b => {
                if (b.type === "brick") {
                    ctx.fillStyle = "#c84c0c";
                    ctx.fillRect(b.x, b.y, b.w, b.h);
                    ctx.strokeStyle = "#000";
                    ctx.strokeRect(b.x, b.y, b.w, b.h);
                } else if (b.type === "question") {
                    ctx.fillStyle = b.hit ? "#808080" : "#fc9838";
                    ctx.fillRect(b.x, b.y, b.w, b.h);
                    ctx.strokeStyle = "#000";
                    ctx.strokeRect(b.x, b.y, b.w, b.h);
                    ctx.fillStyle = "#000";
                    ctx.font = "bold 12px sans-serif";
                    ctx.fillText(b.hit ? "" : "?", b.x + 6, b.y + 15);
                }
            });
        }

        function drawPipes() {
            pipes.forEach(p => {
                ctx.fillStyle = "#00a800";
                ctx.fillRect(p.x, p.y, p.w, p.h);
                ctx.fillStyle = "#00d800";
                ctx.fillRect(p.x - 2, p.y, p.w + 4, 10);
                ctx.strokeStyle = "#000";
                ctx.strokeRect(p.x, p.y, p.w, p.h);
            });
        }

        function drawUI() {
            ctx.fillStyle = "#f8d800";
            ctx.font = "bold 14px sans-serif";
            ctx.fillText("🪙 COINS: " + coins + " | " + difficulty.toUpperCase(), 15, 20);

            if (coinEffect.active) {
                ctx.fillStyle = "#f8d800";
                ctx.beginPath();
                ctx.arc(coinEffect.x, coinEffect.y, 5, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function update() {
            if (!gameStarted) return;

            if (keys.left && mario.x > 0) mario.x -= mario.speed;
            if (keys.right && mario.x < worldWidth - mario.w) mario.x += mario.speed;

            // Kiểm tra chiến thắng khi chạm cờ
            if (mario.x >= flagX) {
                alert("CHIẾN THẮNG MÀN " + difficulty.toUpperCase() + "!");
                if (difficulty === "easy") {
                    unlockedMedium = true;
                    document.getElementById("btnNormal").disabled = false;
                    document.getElementById("btnNormal").innerText = "MEDIUM (Mở khóa)";
                } else if (difficulty === "normal") {
                    unlockedHard = true;
                    document.getElementById("btnHard").disabled = false;
                    document.getElementById("btnHard").innerText = "HARD (Mở khóa)";
                }
                gameStarted = false;
                document.getElementById("menu").style.display = "flex";
                return;
            }

            cameraX = mario.x - canvas.width / 2;
            if (cameraX < 0) cameraX = 0;
            if (cameraX > worldWidth - canvas.width) cameraX = worldWidth - canvas.width;

            mario.dy += mario.gravity;
            mario.y += mario.dy;

            if (mario.y + mario.h >= 160) {
                mario.y = 160 - mario.h;
                mario.dy = 0;
                mario.isGrounded = true;
            }

            blocks.forEach(b => {
                if (mario.x < b.x + b.w && mario.x + mario.w > b.x &&
                    mario.y <= b.y + b.h && mario.y >= b.y && mario.dy < 0) {
                    mario.dy = 1;
                    if (b.type === "question" && !b.hit) {
                        b.hit = true;
                        coins += 1;
                        coinEffect = { x: b.x + 10, y: b.y - 5, dy: -3, active: true };
                    }
                }
            });

            if (coinEffect.active) {
                coinEffect.y += coinEffect.dy;
                coinEffect.dy += 0.2;
                if (coinEffect.dy > 2) coinEffect.active = false;
            }

            piranhas.forEach(p => {
                p.timer++;
                if (p.timer % 500 < 150) {
                    p.visible = true;
                    p.y = 102;
                } else {
                    p.visible = false;
                    p.y = 120;
                }

                if (p.visible &&
                    mario.x < p.x + p.w && mario.x + mario.w > p.x &&
                    mario.y < p.y + p.h && mario.y + mario.h > p.y) {
                    mario.x = 40; mario.y = 130;
                }
            });

            enemies.forEach(e => {
                if (!e.alive) return;
                let enSpeed = (difficulty === "hard") ? 0.8 : 0.6;
                e.x += e.dir * enSpeed;
                if (e.x <= 100 || e.x >= worldWidth - 100) e.dir *= -1;

                if (mario.x < e.x + e.w && mario.x + mario.w > e.x &&
                    mario.y + mario.h >= e.y && mario.y + mario.h <= e.y + 8 && mario.dy > 0) {
                    e.alive = false;
                    mario.dy = mario.jumpPower * 0.6;
                } else if (mario.x < e.x + e.w && mario.x + mario.w > e.x &&
                           mario.y < e.y + e.h && mario.y + mario.h > e.y) {
                    mario.x = 40; mario.y = 130;
                }
            });
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            ctx.translate(-cameraX, 0);

            drawGround();
            drawBlocks();
            drawStairs();
            drawPiranhas();
            drawPipes();
            enemies.forEach(drawGoomba);
            drawMario();

            ctx.restore();
            drawUI();
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        window.addEventListener("keydown", e => {
            if (e.key === "ArrowLeft" || e.key === "a") keys.left = true;
            if (e.key === "ArrowRight" || e.key === "d") keys.right = true;
            if ((e.key === "ArrowUp" || e.key === " " || e.key === "w") && mario.isGrounded) {
                mario.dy = mario.jumpPower; mario.isGrounded = false;
            }
        });

        window.addEventListener("keyup", e => {
            if (e.key === "ArrowLeft" || e.key === "a") keys.left = false;
            if (e.key === "ArrowRight" || e.key === "d") keys.right = false;
        });

        function setupTouchButton(id, onPress, onRelease) {
            const btn = document.getElementById(id);
            if (!btn) return;
            btn.addEventListener("touchstart", e => { e.preventDefault(); onPress(); });
            btn.addEventListener("touchend", e => { e.preventDefault(); if (onRelease) onRelease(); });
            btn.addEventListener("mousedown", onPress);
            btn.addEventListener("mouseup", onRelease);
        }

        setupTouchButton("leftBtn", () => keys.left = true, () => keys.left = false);
        setupTouchButton("rightBtn", () => keys.right = true, () => keys.right = false);
        setupTouchButton("jumpBtn", () => {
            if (mario.isGrounded) { mario.dy = mario.jumpPower; mario.isGrounded = false; }
        });

        gameLoop();
    </script>
</body>
</html>
