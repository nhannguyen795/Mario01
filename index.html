<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Super Mario Bros. Classic</title>
    <style>
        * { box-sizing: border-box; touch-action: manipulation; user-select: none; }
        body { margin: 0; padding: 10px; background: #000; text-align: center; font-family: 'Courier New', Courier, monospace; color: #fff; }
        
        /* Giao diện khung game phong cách NES cổ điển */
        .game-container { position: relative; width: 360px; margin: 0 auto; background: #5c94fc; border: 4px solid #fff; box-shadow: 0 0 15px rgba(255,255,255,0.3); }
        
        canvas { background: #5c94fc; display: block; margin: 0 auto; }
        
        #menu { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #5c94fc; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; }
        #menu h1 { font-size: 26px; color: #fff; text-shadow: 3px 3px #d80000; margin-bottom: 5px; }
        #menu h3 { font-size: 14px; color: #fc9838; margin-bottom: 25px; }
        .menu-btn { width: 200px; padding: 10px; margin: 6px; font-size: 14px; font-family: 'Courier New', Courier, monospace; font-weight: bold; background: #000; color: #fff; border: 2px solid #fff; border-radius: 4px; cursor: pointer; }
        .menu-btn:disabled { color: #808080; border-color: #808080; cursor: not-allowed; }
        .menu-btn:hover:not(:disabled) { background: #e40058; }

        .controls { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 360px; margin: 15px auto 0 auto; }
        .d-pad { display: flex; gap: 10px; }
        .btn { width: 65px; height: 55px; background: #f8d800; color: #000; border: 3px solid #000; font-weight: bold; font-size: 20px; border-radius: 10px; box-shadow: 0 4px 0 #000; cursor: pointer; }
        .btn:active { transform: translateY(4px); box-shadow: 0 0 0 #000; background: #d4b800; }
        .btn-jump { width: 80px; background: #e75910; color: #fff; }
        .btn-jump:active { background: #b54007; }
    </style>
</head>
<body>
    <div class="game-container">
        <div id="menu">
            <h1>SUPER MARIO BROS.</h1>
            <h3>CHỌN ĐỘ KHÓ</h3>
            <button class="menu-btn" onclick="initGame('easy')">1. EASY (Dễ)</button>
            <button id="btnNormal" class="menu-btn" onclick="initGame('normal')" disabled>2. MEDIUM (Khóa 🔒)</button>
            <button id="btnHard" class="menu-btn" onclick="initGame('hard')" disabled>3. HARD (Khóa 🔒)</button>
        </div>

        <canvas id="game" width="360" height="200"></canvas>
    </div>

    <div class="controls">
        <div class="d-pad">
            <button class="btn" id="leftBtn">◄</button>
            <button class="btn" id="rightBtn">►</button>
        </div>
        <button class="btn btn-jump" id="jumpBtn">NHẢY</button>
    </div>

    <script>
        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");

        let gameStarted = false;
        let difficulty = "easy";
        let unlockedMedium = false;
        let unlockedHard = false;

        let mario = {
            x: 40, y: 130, w: 16, h: 24, dy: 0, speed: 2.5,
            gravity: 0.45, jumpPower: -8.5, isGrounded: false, big: false, invincible: false
        };

        let score = 5400;
        let coins = 22;
        let worldTime = 400;
        let cameraX = 0;
        let keys = { left: false, right: false };
        let worldWidth = 900;

        let blocks = [];
        let pipes = [];
        let piranhas = [];
        let enemies = [];
        let stairs = [];
        let mushrooms = []; // Nấm bự lên
        let flagX = 800;

        let coinEffect = { x: 0, y: 0, dy: 0, active: false };

        window.initGame = function(mode) {
            difficulty = mode;
            gameStarted = true;
            document.getElementById("menu").style.display = "none";
            worldTime = 400;

            if (mode === "easy") {
                worldWidth = 900;
                mario.speed = 2.8;
            } else if (mode === "normal") {
                worldWidth = 1500;
                mario.speed = 2.5;
            } else if (mode === "hard") {
                worldWidth = 2500;
                mario.speed = 2.2;
                mario.gravity = 0.5;
            }

            flagX = worldWidth - 150;
            setupWorldObjects();
            mario.x = 40;
            mario.y = 130;
            mario.big = false;
            mario.h = 24;
        };

        function setupWorldObjects() {
            blocks = [
                { x: 150, y: 100, w: 16, h: 16, type: "question", hit: false, hasMushroom: Math.random() < 0.10 },
                { x: 166, y: 100, w: 16, h: 16, type: "brick" },
                { x: 182, y: 100, w: 16, h: 16, type: "question", hit: false, hasMushroom: Math.random() < 0.10 }
            ];
            pipes = [{ x: 400, y: 120, w: 32, h: 40 }];
            piranhas = [{ x: 408, y: 120, w: 16, h: 20, visible: false, timer: 0 }];
            enemies = [{ x: 280, y: 144, w: 16, h: 16, dir: -1, alive: true }];
            stairs = [{ x: 650, base: 160, steps: 4 }];
            mushrooms = [];

            if (difficulty !== "easy") {
                blocks.push({ x: 750, y: 90, w: 16, h: 16, type: "question", hit: false, hasMushroom: Math.random() < 0.10 });
                pipes.push({ x: 900, y: 110, w: 32, h: 50 });
                piranhas.push({ x: 908, y: 110, w: 16, h: 20, visible: false, timer: 50 });
                enemies.push({ x: 800, y: 144, w: 16, h: 16, dir: 1, alive: true });
            }
        }

        function drawGround() {
            const groundY = 160;
            ctx.fillStyle = "#c84c0c";
            ctx.fillRect(0, groundY, worldWidth, 40);

            ctx.strokeStyle = "#000";
            ctx.lineWidth = 1;
            for (let x = 0; x < worldWidth; x += 16) {
                for (let y = groundY; y < canvas.height; y += 10) {
                    ctx.strokeRect(x, y, 16, 10);
                    ctx.fillStyle = "#fc9838";
                    ctx.fillRect(x + 2, y + 2, 12, 2);
                }
            }

            // Bụi cỏ
            ctx.fillStyle = "#00a800";
            [100, 500, 1150, 1850].forEach(gx => {
                if (gx < worldWidth) {
                    ctx.fillRect(gx, groundY - 12, 32, 12);
                    ctx.fillStyle = "#00d800";
                    ctx.fillRect(gx + 6, groundY - 16, 20, 4);
                    ctx.fillStyle = "#00a800";
                }
            });

            // Cột cờ đích
            ctx.fillStyle = "#fff";
            ctx.fillRect(flagX, 70, 3, 90);
            ctx.fillStyle = "#00d800";
            ctx.beginPath();
            ctx.arc(flagX + 1.5, 70, 4, 0, Math.PI * 2);
            ctx.fill();

            // Lâu đài
            ctx.fillStyle = "#c84c0c";
            ctx.fillRect(flagX + 35, 100, 50, 60);
            ctx.strokeRect(flagX + 35, 100, 50, 60);
            ctx.fillStyle = "#000";
            ctx.fillRect(flagX + 50, 130, 18, 30);
        }

        // Vẽ Mario chi tiết giống mẫu cổ điển
        function drawMario() {
            let mx = mario.x;
            let my = mario.y;

            if (mario.big) {
                // Mario bự (Super Mario)
                ctx.fillStyle = "#e40058"; // Áo đỏ
                ctx.fillRect(mx + 2, my, 12, 10);
                ctx.fillStyle = "#fc9838"; // Mặt
                ctx.fillRect(mx + 3, my + 5, 10, 8);
                ctx.fillStyle = "#0000d8"; // Quần yếm xanh
                ctx.fillRect(mx + 2, my + 13, 12, 13);
            } else {
                // Mario nhỏ
                ctx.fillStyle = "#e40058"; // Mũ & Áo
                ctx.fillRect(mx + 2, my, 12, 5);
                ctx.fillRect(mx + 2, my + 10, 12, 7);
                ctx.fillStyle = "#fc9838"; // Mặt
                ctx.fillStyle = "#fc9838";
                ctx.fillRect(mx + 3, my + 5, 10, 5);
                ctx.fillStyle = "#0000d8"; // Quần
                ctx.fillRect(mx + 3, my + 17, 10, 7);
            }
        }

        // Vẽ nấm bự lên xuất hiện từ ô ?
        function drawMushrooms() {
            mushrooms.forEach(m => {
                ctx.fillStyle = "#e40058"; // Đỏ đầu nấm
                ctx.fillRect(m.x, m.y, 16, 10);
                ctx.fillStyle = "#fff"; // Chấm trắng & thân nấm
                ctx.fillRect(m.x + 3, m.y + 10, 10, 6);
                ctx.fillRect(m.x + 2, m.y + 3, 3, 3);
                ctx.fillRect(m.x + 11, m.y + 3, 3, 3);
            });
        }

        function drawGoomba(e) {
            if (!e.alive) return;
            ctx.fillStyle = "#a81000";
            ctx.fillRect(e.x + 2, e.y, 12, 10);
            ctx.fillStyle = "#fc9838";
            ctx.fillRect(e.x, e.y + 10, 16, 6);
            ctx.fillStyle = "#fff";
            ctx.fillRect(e.x + 3, e.y + 4, 3, 4);
            ctx.fillRect(e.x + 10, e.y + 4, 3, 4);
        }

        function drawPiranhas() {
            piranhas.forEach(p => {
                if (!p.visible) return;
                ctx.fillStyle = "#00d800";
                ctx.fillRect(p.x + 4, p.y + 8, 8, p.h - 8);
                ctx.fillStyle = "#e40058";
                ctx.fillRect(p.x, p.y, 16, 10);
                ctx.fillStyle = "#fff";
                ctx.fillRect(p.x + 2, p.y + 4, 3, 3);
                ctx.fillRect(p.x + 11, p.y + 4, 3, 3);
            });
        }

        function drawBlocks() {
            blocks.forEach(b => {
                if (b.type === "brick") {
                    ctx.fillStyle = "#c84c0c";
                    ctx.fillRect(b.x, b.y, b.w, b.h);
                    ctx.strokeStyle = "#000";
                    ctx.strokeRect(b.x, b.y, b.w, b.h);
                } else if (b.type === "question") {
                    ctx.fillStyle = b.hit ? "#808080" : "#fc9838";
                    ctx.fillRect(b.x, b.y, b.w, b.h);
                    ctx.strokeStyle = "#000";
                    ctx.strokeRect(b.x, b.y, b.w, b.h);
                    ctx.fillStyle = "#000";
                    ctx.font = "bold 10px monospace";
                    ctx.fillText(b.hit ? "" : "?", b.x + 4, b.y + 12);
                }
            });
        }

        function drawPipes() {
            pipes.forEach(p => {
                ctx.fillStyle = "#00a800";
                ctx.fillRect(p.x, p.y, p.w, p.h);
                ctx.fillStyle = "#00d800";
                ctx.fillRect(p.x - 2, p.y, p.w + 4, 8);
                ctx.strokeStyle = "#000";
                ctx.strokeRect(p.x, p.y, p.w, p.h);
            });
        }

        function drawStairs() {
            stairs.forEach(s => {
                for (let i = 0; i < s.steps; i++) {
                    for (let j = 0; j <= i; j++) {
                        let bx = s.x + (i * 16);
                        let by = s.base - ((j + 1) * 12);
                        ctx.fillStyle = "#c84c0c";
                        ctx.fillRect(bx, by, 16, 12);
                        ctx.strokeStyle = "#000";
                        ctx.strokeRect(bx, by, 16, 12);
                    }
                }
            });
        }

        // Vẽ thanh thông tin chuẩn ảnh gốc NES
        function drawUI() {
            ctx.fillStyle = "#fff";
            ctx.font = "bold 11px monospace";
            ctx.fillText("MARIO", 25, 18);
            ctx.fillText("WORLD", 155, 18);
            ctx.fillText("TIME", 275, 18);

            ctx.fillText(String(score).padStart(6, '0'), 25, 30);
            ctx.fillStyle = "#f8d800";
            ctx.beginPath();
            ctx.arc(88, 26, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#fff";
            ctx.fillText("x" + String(coins).padStart(2, '0'), 98, 30);

            ctx.fillText("1-1", 170, 30);
            ctx.fillText(String(Math.max(0, Math.floor(worldTime))), 285, 30);
        }

        function update() {
            if (!gameStarted) return;

            worldTime -= 0.02; // Đếm ngược thời gian

            if (keys.left && mario.x > 0) mario.x -= mario.speed;
            if (keys.right && mario.x < worldWidth - mario.w) mario.x += mario.speed;

            if (mario.x >= flagX) {
                alert("CHIẾN THẮNG MÀN " + difficulty.toUpperCase() + "!");
                if (difficulty === "easy") {
                    unlockedMedium = true;
                    document.getElementById("btnNormal").disabled = false;
                    document.getElementById("btnNormal").innerText = "2. MEDIUM (Mở khóa)";
                } else if (difficulty === "normal") {
                    unlockedHard = true;
                    document.getElementById("btnHard").disabled = false;
                    document.getElementById("btnHard").innerText = "3. HARD (Mở khóa)";
                }
                gameStarted = false;
                document.getElementById("menu").style.display = "flex";
                return;
            }

            cameraX = mario.x - canvas.width / 2;
            if (cameraX < 0) cameraX = 0;
            if (cameraX > worldWidth - canvas.width) cameraX = worldWidth - canvas.width;

            mario.dy += mario.gravity;
            mario.y += mario.dy;

            if (mario.y + mario.h >= 160) {
                mario.y = 160 - mario.h;
                mario.dy = 0;
                mario.isGrounded = true;
            }

            // Xử lý nấm bự lên di chuyển
            mushrooms.forEach(m => {
                m.dy = (m.dy || 0) + 0.4;
                m.y += m.dy;
                if (m.y + 16 >= 160) { m.y = 160 - 16; m.dy = 0; }
                m.x += m.dir * 1;

                // Mario ăn nấm (tỷ lệ 10% từ ô ?)
                if (mario.x < m.x + 16 && mario.x + mario.w > m.x && mario.y < m.y + 16 && mario.y + mario.h > m.y) {
                    mario.big = true; // Mario bự lên
                    mario.h = 32;     // Tăng chiều cao
                    mario.y -= 8;     // Đẩy lên tránh kẹt sàn
                    m.collected = true;
                    score += 1000;
                }
            });
            mushrooms = mushrooms.filter(m => !m.collected);

            // Va chạm khối ? lấy nấm hoặc xu (10% ra nấm)
            blocks.forEach(b => {
                if (mario.x < b.x + b.w && mario.x + mario.w > b.x &&
                    mario.y <= b.y + b.h && mario.y >= b.y && mario.dy < 0) {
                    mario.dy = 1;
                    if (b.type === "question" && !b.hit) {
                        b.hit = true;
                        if (b.hasMushroom) {
                            // Xuất hiện nấm bự lên (10% tỷ lệ)
                            mushrooms.push({ x: b.x, y: b.y - 16, dir: 1, dy: -3 });
                        } else {
                            coins += 1;
                            score += 200;
                            coinEffect = { x: b.x + 8, y: b.y - 5, dy: -3, active: true };
                        }
                    }
                }
            });

            if (coinEffect.active) {
                coinEffect.y += coinEffect.dy;
                coinEffect.dy += 0.2;
                if (coinEffect.dy > 2) coinEffect.active = false;
            }

            // Cây ăn thịt
            piranhas.forEach(p => {
                p.timer++;
                if (p.timer % 400 < 120) {
                    p.visible = true;
                    p.y = 100;
                } else {
                    p.visible = false;
                    p.y = 120;
                }

                if (p.visible && mario.x < p.x + p.w && mario.x + mario.w > p.x && mario.y < p.y + p.h && mario.y + mario.h > p.y) {
                    handleMarioHit();
                }
            });

            // Kẻ địch Goomba
            enemies.forEach(e => {
                if (!e.alive) return;
                e.x += e.dir * 0.6;
                if (e.x <= 100 || e.x >= worldWidth - 100) e.dir *= -1;

                if (mario.x < e.x + e.w && mario.x + mario.w > e.x &&
                    mario.y + mario.h >= e.y && mario.y + mario.h <= e.y + 8 && mario.dy > 0) {
                    e.alive = false;
                    score += 100;
                    mario.dy = mario.jumpPower * 0.6;
                } else if (mario.x < e.x + e.w && mario.x + mario.w > e.x && mario.y < e.y + e.h && mario.y + mario.h > e.y) {
                    handleMarioHit();
                }
            });
        }

        // Xử lý khi Mario bị chạm địch (nếu bự thì biến nhỏ lại, nếu nhỏ thì reset)
        function handleMarioHit() {
            if (mario.big) {
                mario.big = false;
                mario.h = 24;
                mario.invincible = true;
                setTimeout(() => { mario.invincible = false; }, 1500); // Bất tử tạm thời sau khi thu nhỏ
            } else if (!mario.invincible) {
                mario.x = 40; mario.y = 130; // Chết, về đầu
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            ctx.translate(-cameraX, 0);

            drawGround();
            drawBlocks();
            drawStairs();
            drawPiranhas();
            drawPipes();
            drawMushrooms();
            enemies.forEach(drawGoomba);
            drawMario();

            ctx.restore();
            drawUI();
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        window.addEventListener("keydown", e => {
            if (e.key === "ArrowLeft" || e.key === "a") keys.left = true;
            if (e.key === "ArrowRight" || e.key === "d") keys.right = true;
            if ((e.key === "ArrowUp" || e.key === " " || e.key === "w") && mario.isGrounded) {
                mario.dy = mario.jumpPower; mario.isGrounded = false;
            }
        });

        window.addEventListener("keyup", e => {
            if (e.key === "ArrowLeft" || e.key === "a") keys.left = false;
            if (e.key === "ArrowRight" || e.key === "d") keys.right = false;
        });

        function setupTouchButton(id, onPress, onRelease) {
            const btn = document.getElementById(id);
            if (!btn) return;
            btn.addEventListener("touchstart", e => { e.preventDefault(); onPress(); });
            btn.addEventListener("touchend", e => { e.preventDefault(); if (onRelease) onRelease(); });
            btn.addEventListener("mousedown", onPress);
            btn.addEventListener("mouseup", onRelease);
        }

        setupTouchButton("leftBtn", () => keys.left = true, () => keys.left = false);
        setupTouchButton("rightBtn", () => keys.right = true, () => keys.right = false);
        setupTouchButton("jumpBtn", () => {
            if (mario.isGrounded) { mario.dy = mario.jumpPower; mario.isGrounded = false; }
        });

        gameLoop();
    </script>
</body>
</html>
