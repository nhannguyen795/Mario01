<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Super Mario Bros. HD Pixel</title>
    <style>
        * { box-sizing: border-box; touch-action: manipulation; user-select: none; }
        body { margin: 0; padding: 10px; background: #000; text-align: center; font-family: 'Courier New', Courier, monospace; color: #fff; }
        
        .game-container { position: relative; width: 360px; margin: 0 auto; background: #5c94fc; border: 4px solid #fff; box-shadow: 0 0 15px rgba(255,255,255,0.4); }
        canvas { background: #5c94fc; display: block; margin: 0 auto; image-rendering: pixelated; image-rendering: crisp-edges; }
        
        #menu { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #5c94fc; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; }
        #menu h1 { font-size: 24px; color: #fff; text-shadow: 3px 3px #d80000; margin-bottom: 5px; }
        #menu h3 { font-size: 13px; color: #fc9838; margin-bottom: 25px; }
        .menu-btn { width: 200px; padding: 10px; margin: 6px; font-size: 14px; font-family: 'Courier New', Courier, monospace; font-weight: bold; background: #000; color: #fff; border: 2px solid #fff; border-radius: 4px; cursor: pointer; }
        .menu-btn:disabled { color: #808080; border-color: #808080; cursor: not-allowed; }
        .menu-btn:hover:not(:disabled) { background: #e40058; }

        .controls { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 360px; margin: 15px auto 0 auto; }
        .d-pad { display: flex; gap: 10px; }
        .btn { width: 65px; height: 55px; background: #f8d800; color: #000; border: 3px solid #000; font-weight: bold; font-size: 20px; border-radius: 10px; box-shadow: 0 4px 0 #000; cursor: pointer; }
        .btn:active { transform: translateY(4px); box-shadow: 0 0 0 #000; background: #d4b800; }
        .btn-jump { width: 80px; background: #e75910; color: #fff; }
        .btn-jump:active { background: #b54007; }
    </style>
</head>
<body>
    <div class="game-container">
        <div id="menu">
            <h1>SUPER MARIO BROS.</h1>
            <h3>CHỌN ĐỘ KHÓ</h3>
            <button class="menu-btn" onclick="initGame('easy')">1. EASY (Dễ)</button>
            <button id="btnNormal" class="menu-btn" onclick="initGame('normal')" disabled>2. MEDIUM (Khóa 🔒)</button>
            <button id="btnHard" class="menu-btn" onclick="initGame('hard')" disabled>3. HARD (Khóa 🔒)</button>
        </div>

        <canvas id="game" width="360" height="200"></canvas>
    </div>

    <div class="controls">
        <div class="d-pad">
            <button class="btn" id="leftBtn">◄</button>
            <button class="btn" id="rightBtn">►</button>
        </div>
        <button class="btn btn-jump" id="jumpBtn">NHẢY</button>
    </div>

    <script>
        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let bgmInterval = null;

        function startBGM() {
            if (audioCtx.state === 'suspended') { audioCtx.resume(); }
            if (bgmInterval) clearInterval(bgmInterval);
            let notes = [523.25, 587.33, 659.25, 523.25, 659.25, 783.99, 659.25, 523.25];
            let step = 0;
            bgmInterval = setInterval(() => {
                if (!gameStarted) return;
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = "square";
                osc.frequency.value = notes[step];
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                let startTime = audioCtx.currentTime;
                osc.start(startTime);
                gain.gain.setValueAtTime(0.04, startTime);
                gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.12);
                osc.stop(startTime + 0.12);
                step = (step + 1) % notes.length;
            }, 140);
        }

        function stopBGM() {
            if (bgmInterval) { clearInterval(bgmInterval); bgmInterval = null; }
        }

        function playJumpSound() {
            if (audioCtx.state === 'suspended') { audioCtx.resume(); }
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = "square";
            let startTime = audioCtx.currentTime;
            osc.frequency.setValueAtTime(150, startTime);
            osc.frequency.exponentialRampToValueAtTime(600, startTime + 0.15);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(startTime);
            gain.gain.setValueAtTime(0.1, startTime);
            gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.15);
            osc.stop(startTime + 0.15);
        }

        function playCoinSound() {
            if (audioCtx.state === 'suspended') { audioCtx.resume(); }
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = "square";
            let startTime = audioCtx.currentTime;
            osc.frequency.setValueAtTime(987.77, startTime);
            osc.frequency.setValueAtTime(1318.51, startTime + 0.08);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(startTime);
            gain.gain.setValueAtTime(0.1, startTime);
            gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.25);
            osc.stop(startTime + 0.25);
        }

        function playPowerUpSound() {
            if (audioCtx.state === 'suspended') { audioCtx.resume(); }
            let notes = [261.63, 329.63, 392.00, 523.25, 659.25, 783.99];
            let duration = 0.08;
            notes.forEach((freq, index) => {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = "square";
                osc.frequency.value = freq;
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                let startTime = audioCtx.currentTime + (index * duration);
                osc.start(startTime);
                gain.gain.setValueAtTime(0.1, startTime);
                gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
                osc.stop(startTime + duration);
            });
        }

        function playGameOverSound() {
            stopBGM();
            if (audioCtx.state === 'suspended') { audioCtx.resume(); }
            let notes = [330, 311, 293, 261, 220];
            let times = [0, 0.15, 0.3, 0.45, 0.6];
            let duration = 0.12;
            notes.forEach((freq, index) => {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = "square";
                osc.frequency.value = freq;
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                let startTime = audioCtx.currentTime + times[index];
                osc.start(startTime);
                gain.gain.setValueAtTime(0.1, startTime);
                gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
                osc.stop(startTime + duration);
            });
        }

        let gameStarted = false;
        let difficulty = "easy";
        let unlockedMedium = false;
        let unlockedHard = false;

        let mario = {
            x: 40, y: 130, w: 16, h: 24, dx: 0, dy: 0, speed: 2.5,
            gravity: 0.45, jumpPower: -8.5, isGrounded: false, big: false, invincible: false
        };

        let score = 5400;
        let coins = 22;
        let worldTime = 400;
        let cameraX = 0;
        let keys = { left: false, right: false };
        let worldWidth = 1000;

        let blocks = [];
        let pipes = [];
        let piranhas = [];
        let enemies = [];
        let stairs = [];
        let mushrooms = [];
        let clouds = [];
        let dustParticles = []; // Mảng chứa hiệu ứng hạt bụi khi di chuyển
        let flagX = 900;

        let coinEffect = { x: 0, y: 0, dy: 0, active: false };

        window.initGame = function(mode) {
            difficulty = mode;
            gameStarted = true;
            document.getElementById("menu").style.display = "none";
            worldTime = 400;

            if (mode === "easy") {
                worldWidth = 1000;
                mario.speed = 2.8;
            } else if (mode === "normal") {
                worldWidth = 1600;
                mario.speed = 2.5;
            } else if (mode === "hard") {
                worldWidth = 2600;
                mario.speed = 2.2;
                mario.gravity = 0.5;
            }

            flagX = worldWidth - 150;
            setupWorldObjects();
            mario.x = 40;
            mario.y = 130;
            mario.big = false;
            mario.h = 24;
            dustParticles = [];

            startBGM();
        };

        function setupWorldObjects() {
            blocks = [
                { x: 150, y: 100, w: 16, h: 16, type: "question", hit: false, hasMushroom: Math.random() < 0.15 },
                { x: 166, y: 100, w: 16, h: 16, type: "brick" },
                { x: 182, y: 100, w: 16, h: 16, type: "question", hit: false, hasMushroom: Math.random() < 0.15 }
            ];
            
            pipes = [
                { x: 380, y: 120, w: 32, h: 40 },
                { x: 700, y: 110, w: 32, h: 50 },
                { x: 1100, y: 100, w: 32, h: 60 }
            ];

            piranhas = [
                { x: 388, y: 120, w: 16, h: 20, visible: false, timer: 0 },
                { x: 708, y: 110, w: 16, h: 20, visible: false, timer: 60 },
                { x: 1108, y: 100, w: 16, h: 20, visible: false, timer: 120 }
            ];

            enemies = [
                { x: 280, y: 144, w: 16, h: 16, dir: -1, alive: true },
                { x: 550, y: 144, w: 16, h: 16, dir: 1, alive: true },
                { x: 900, y: 144, w: 16, h: 16, dir: -1, alive: true }
            ];

            stairs = [{ x: 600, base: 160, steps: 4 }];
            mushrooms = [];
            
            clouds = [
                { x: 60, y: 35 }, { x: 280, y: 25 }, { x: 550, y: 40 }, 
                { x: 950, y: 30 }, { x: 1400, y: 35 }, { x: 2000, y: 25 }
            ];

            if (difficulty !== "easy") {
                blocks.push({ x: 850, y: 90, w: 16, h: 16, type: "question", hit: false, hasMushroom: Math.random() < 0.15 });
                pipes.push({ x: 1400, y: 110, w: 32, h: 50 });
                piranhas.push({ x: 1408, y: 110, w: 16, h: 20, visible: false, timer: 30 });
                enemies.push({ x: 1250, y: 144, w: 16, h: 16, dir: 1, alive: true });
            }
        }

        function drawClouds() {
            ctx.fillStyle = "#fff";
            clouds.forEach(c => {
                let cx = c.x;
                let cy = c.y;
                ctx.fillRect(cx + 4, cy, 24, 10);
                ctx.fillRect(cx, cy + 4, 32, 6);
                ctx.fillStyle = "#e0e0e0";
                ctx.fillRect(cx + 4, cy + 10, 24, 2);
                ctx.fillStyle = "#fff";
            });
        }

        function drawGround() {
            const groundY = 160;
            ctx.fillStyle = "#c84c0c";
            ctx.fillRect(0, groundY, worldWidth, 40);

            ctx.strokeStyle = "#000";
            ctx.lineWidth = 1;
            for (let x = 0; x < worldWidth; x += 16) {
                for (let y = groundY; y < canvas.
